<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Requests</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/dashboard.css" />
  <link rel="stylesheet" href="/assets/css/admin-table.css" />
  <script src="/assets/js/env-config.js" defer></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="brand">ADMIN</div>
      <nav>
        <a href="/pages/admin/dashboard.html">Overview</a>
        <a href="/pages/admin/members.html">Members</a>
        <a href="/pages/admin/skills.html">Skills &amp; Categories</a>
        <a href="/pages/admin/opportunities.html">Opportunities</a>
        <a href="/pages/admin/events.html">Events</a>
        <a href="/pages/admin/mentors.html">Mentors</a>
        <a href="/pages/admin/neighborhoods.html">Neighborhoods</a>
        <a href="/pages/admin/announcements.html">Announcements</a>
        <a href="/pages/admin/reports.html">Reports</a>
        <a href="/pages/admin/verification.html" class="active">Verification Requests</a>
        <a href="/pages/admin/audit-log.html">Audit Log</a>
        <a href="/pages/admin/settings.html">Platform Settings</a>
      </nav>
    </aside>

    <main class="dashboard-main" style="max-width:900px;">
      <h1>Verification Requests</h1>
      <div id="list" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <p class="placeholder-text">Loading…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from '/assets/js/auth.js';
    import { supabase } from '/assets/js/supabase-client.js';
    import { logAdminAction } from '/assets/js/audit-log.js';
    import { escapeHtml } from '/assets/js/utils.js';

    const admin = await requireRole(['admin', 'super_admin']);
    if (!admin) throw new Error('Not authorized');

    async function load() {
      const { data, error } = await supabase
        .from('verification_requests')
        .select('id, status, supporting_info, created_at, profiles(id, full_name, username)')
        .order('created_at', { ascending: false });

      const list = document.getElementById('list');
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="placeholder-text">No verification requests.</p>';
        return;
      }

      list.innerHTML = data.map(r => `
        <div class="list-row">
          <div>
            <a href="/members/${encodeURIComponent(r.profiles.username)}" target="_blank"><strong>${escapeHtml(r.profiles.full_name)}</strong></a>
            <p class="placeholder-text" style="margin:4px 0 0;">${escapeHtml(r.supporting_info || 'No additional info provided.')}</p>
            <p class="placeholder-text" style="margin:2px 0 0;font-size:0.75rem;">${new Date(r.created_at).toLocaleString()}</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            ${r.status === 'pending' ? `
              <button class="btn-ghost approve-btn" data-id="${r.id}" data-profile="${r.profiles.id}">Approve</button>
              <button class="btn-ghost reject-btn" data-id="${r.id}" data-profile="${r.profiles.id}">Reject</button>
              <button class="btn-ghost more-info-btn" data-id="${r.id}">Request Info</button>
            ` : `<span class="status-badge">${escapeHtml(r.status)}</span>`}
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.approve-btn').forEach(btn => btn.addEventListener('click', () => resolve(btn.dataset.id, btn.dataset.profile, 'approved')));
      list.querySelectorAll('.reject-btn').forEach(btn => btn.addEventListener('click', () => resolve(btn.dataset.id, btn.dataset.profile, 'rejected')));
      list.querySelectorAll('.more-info-btn').forEach(btn => btn.addEventListener('click', () => resolve(btn.dataset.id, null, 'more_info_requested')));
    }

    async function resolve(requestId, profileId, newStatus) {
      await supabase.from('verification_requests').update({
        status: newStatus, reviewed_by: admin.id, reviewed_at: new Date().toISOString(),
      }).eq('id', requestId);

      if (profileId) {
        await supabase.from('profiles').update({
          verification_status: newStatus,
          is_verified: newStatus === 'approved',
        }).eq('id', profileId);
      }

      await logAdminAction({
        adminId: admin.id, action: `verification_${newStatus}`,
        targetTable: 'verification_requests', targetId: requestId,
      });
      load();
    }

    load();
  </script>
  <style>.list-row { display: flex; justify-content: space-between; align-items: flex-start; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; gap: 16px; }</style>
</body>
</html>
