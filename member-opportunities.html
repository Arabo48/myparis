<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Opportunities</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="brand">MY TOWN TECH</div>
      <nav>
        <a href="member-dashboard.html">Overview</a>
        <a href="member-profile.html">My Profile</a>
        <a href="member-projects.html">My Projects</a>
        <a href="member-opportunities.html" class="active">Opportunities</a>
        <a href="member-events.html">Events</a>
        <a href="member-mentorship.html">Mentorship</a>
        <a href="member-settings.html">Settings</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <h1>My Opportunities</h1>
      <div id="oppList" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <p class="placeholder-text">Loading…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from './auth.js';
    import { supabase } from './supabase-client.js';
    import { escapeHtml } from './utils.js';

    const profile = await requireRole(['member', 'mentor', 'organization', 'admin', 'super_admin']);
    if (!profile) throw new Error('Not authorized');

    async function load() {
      const { data, error } = await supabase
        .from('saved_opportunities')
        .select('id, status, opportunities(title, slug, category, deadline)')
        .eq('profile_id', profile.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('oppList');
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="placeholder-text">You haven\'t saved any opportunities yet. <a href="public-opportunities.html">Browse opportunities</a>.</p>';
        return;
      }

      list.innerHTML = data.map(row => `
        <div class="list-row">
          <div>
            <a href="public-opportunity-detail.html?s=${encodeURIComponent(row.opportunities.slug)}"><strong>${escapeHtml(row.opportunities.title)}</strong></a>
            <p class="placeholder-text" style="margin:4px 0 0;">${escapeHtml(row.opportunities.category)} ${row.opportunities.deadline ? '· Deadline: ' + row.opportunities.deadline : ''}</p>
          </div>
          <span class="status-badge">${escapeHtml(row.status)}</span>
        </div>
      `).join('');
    }

    load();
  </script>
  <style>
    .list-row { display: flex; justify-content: space-between; align-items: center; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; }
  </style>
</body>
</html>
