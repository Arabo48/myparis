<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="forms.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="brand">MY TOWN TECH</div>
      <nav>
        <a href="member-dashboard.html">Overview</a>
        <a href="member-profile.html">My Profile</a>
        <a href="member-skills.html">My Skills</a>
        <a href="member-projects.html" class="active">My Projects</a>
        <a href="member-services.html">My Services</a>
        <a href="member-achievements.html">My Achievements</a>
        <a href="member-settings.html">Settings</a>
        <a href="admin-dashboard.html" id="switchToAdminLink" hidden style="border-top:1px solid var(--color-border);margin-top:8px;padding-top:14px;">Switch to Admin View</a>
      </nav>
    </aside>

    <main class="dashboard-main" style="max-width:700px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1>My Projects</h1>
        <button class="btn-primary" id="newProjectBtn">+ New Project</button>
      </div>

      <div id="projectList" style="margin-top:20px;display:flex;flex-direction:column;gap:12px;">
        <p class="placeholder-text">Loading…</p>
      </div>
    </main>
  </div>

  <!-- Create/Edit modal -->
  <div id="projectModal" class="modal-overlay" hidden>
    <form class="modal-card" id="projectForm">
      <h2 id="modalTitle">New Project</h2>

      <label for="pTitle">Title</label>
      <input id="pTitle" required />

      <label for="pDescription">Description</label>
      <textarea id="pDescription" rows="4"></textarea>

      <label for="pTechnologies">Technologies used (comma-separated)</label>
      <input id="pTechnologies" placeholder="React, Node.js, PostgreSQL" />

      <label for="pStatus">Status</label>
      <select id="pStatus">
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
        <option value="prototype">Prototype</option>
      </select>

      <label for="pProjectUrl">Live project URL</label>
      <input id="pProjectUrl" type="url" />

      <label for="pGithubUrl">GitHub URL</label>
      <input id="pGithubUrl" type="url" />

      <label for="pImageUrl">Image URL</label>
      <input id="pImageUrl" type="url" placeholder="Link to a hosted screenshot" />

      <label for="pCompletionDate">Completion date</label>
      <input id="pCompletionDate" type="date" />

      <div id="modalError" class="form-error" role="alert" hidden></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="saveProjectBtn">Save Project</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { requireRole } from './auth.js';
    import { supabase } from './supabase-client.js';
    import { uniqueSlug, escapeHtml } from './utils.js';

    const profile = await requireRole(['member', 'mentor', 'organization', 'admin', 'super_admin']);
    if (profile && ["admin", "super_admin"].includes(profile.role)) {
      const switchLink = document.getElementById("switchToAdminLink");
      if (switchLink) switchLink.hidden = false;
    }
    if (!profile) throw new Error('Not authorized');

    let editingId = null;

    async function loadProjects() {
      const { data, error } = await supabase
        .from('projects')
        .select('*')
        .eq('owner_id', profile.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('projectList');
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="placeholder-text">You haven\'t added any projects yet.</p>';
        return;
      }

      list.innerHTML = data.map(p => `
        <div class="list-row">
          <div>
            <strong>${escapeHtml(p.title)}</strong>
            <span class="status-badge status-${p.status}">${p.status.replace('_', ' ')}</span>
            <p class="placeholder-text" style="margin:4px 0 0;">public-project-detail.html?s=${escapeHtml(p.slug)}</p>
          </div>
          <div class="list-row-actions">
            <button class="btn-ghost edit-btn" data-id="${p.id}">Edit</button>
            <button class="btn-ghost delete-btn" data-id="${p.id}">Delete</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.edit-btn').forEach(btn =>
        btn.addEventListener('click', () => openModal(data.find(p => p.id === btn.dataset.id))));
      list.querySelectorAll('.delete-btn').forEach(btn =>
        btn.addEventListener('click', () => deleteProject(btn.dataset.id)));
    }

    async function deleteProject(id) {
      if (!confirm('Delete this project? This cannot be undone.')) return;
      await supabase.from('projects').delete().eq('id', id);
      loadProjects();
    }

    function openModal(project = null) {
      editingId = project?.id || null;
      document.getElementById('modalTitle').textContent = project ? 'Edit Project' : 'New Project';
      document.getElementById('pTitle').value = project?.title || '';
      document.getElementById('pDescription').value = project?.description || '';
      document.getElementById('pTechnologies').value = (project?.technologies || []).join(', ');
      document.getElementById('pStatus').value = project?.status || 'in_progress';
      document.getElementById('pProjectUrl').value = project?.project_url || '';
      document.getElementById('pGithubUrl').value = project?.github_url || '';
      document.getElementById('pImageUrl').value = project?.image_url || '';
      document.getElementById('pCompletionDate').value = project?.completion_date || '';
      document.getElementById('modalError').hidden = true;
      document.getElementById('projectModal').hidden = false;
    }

    function closeModal() {
      document.getElementById('projectModal').hidden = true;
    }

    document.getElementById('newProjectBtn').addEventListener('click', () => openModal());
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('modalError');
      const saveBtn = document.getElementById('saveProjectBtn');
      errorBox.hidden = true;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      const title = document.getElementById('pTitle').value.trim();
      const payload = {
        title,
        description: document.getElementById('pDescription').value.trim() || null,
        technologies: document.getElementById('pTechnologies').value
          .split(',').map(t => t.trim()).filter(Boolean),
        status: document.getElementById('pStatus').value,
        project_url: document.getElementById('pProjectUrl').value.trim() || null,
        github_url: document.getElementById('pGithubUrl').value.trim() || null,
        image_url: document.getElementById('pImageUrl').value.trim() || null,
        completion_date: document.getElementById('pCompletionDate').value || null,
      };

      try {
        if (editingId) {
          const { error } = await supabase.from('projects').update(payload).eq('id', editingId);
          if (error) throw error;
        } else {
          const slug = await uniqueSlug(title, async (candidate) => {
            const { data } = await supabase.from('projects').select('id').eq('slug', candidate).maybeSingle();
            return !!data;
          });
          const { error } = await supabase.from('projects').insert({ ...payload, slug, owner_id: profile.id });
          if (error) throw error;
        }
        closeModal();
        loadProjects();
      } catch (err) {
        errorBox.textContent = 'Could not save the project. Please check the fields and try again.';
        errorBox.hidden = false;
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Project';
      }
    });

    loadProjects();
  </script>
  <style>
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column;
    }
    .modal-card label { font-size: 0.85rem; color: var(--color-text-muted); margin: 12px 0 6px; }
    .modal-card input, .modal-card select, .modal-card textarea {
      background: var(--color-surface-2); border: 1px solid var(--color-border);
      border-radius: 8px; padding: 10px 12px; color: var(--color-text); font-family: inherit;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .list-row-actions { display: flex; gap: 8px; }
  </style>
</body>
</html>
