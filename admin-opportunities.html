<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Opportunities</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="admin-table.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="brand">ADMIN</div>
      <nav>
        <a href="admin-dashboard.html">Overview</a>
        <a href="admin-members.html">Members</a>
        <a href="admin-skills.html">Skills &amp; Categories</a>
        <a href="admin-opportunities.html" class="active">Opportunities</a>
        <a href="admin-events.html">Events</a>
        <a href="admin-mentors.html">Mentors</a>
        <a href="admin-neighborhoods.html">Neighborhoods</a>
        <a href="admin-announcements.html">Announcements</a>
        <a href="admin-reports.html">Reports</a>
        <a href="admin-verification.html">Verification Requests</a>
        <a href="admin-audit-log.html">Audit Log</a>
        <a href="admin-settings.html">Platform Settings</a>
      </nav>
    </aside>

    <main class="dashboard-main" style="max-width:1000px;">
      <h1>Manage Opportunities</h1>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Title</th><th>Category</th><th>Posted by</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="placeholder-text">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from './auth.js';
    import { supabase } from './supabase-client.js';
    import { logAdminAction } from './audit-log.js';
    import { escapeHtml } from './utils.js';

    const admin = await requireRole(['admin', 'super_admin']);
    if (!admin) throw new Error('Not authorized');

    async function load() {
      const { data, error } = await supabase
        .from('opportunities')
        .select('id, title, slug, category, is_approved, profiles(full_name)')
        .order('created_at', { ascending: false })
        .limit(100);

      const rows = document.getElementById('rows');
      if (error || !data || data.length === 0) {
        rows.innerHTML = '<tr><td colspan="5" class="placeholder-text">No opportunities yet.</td></tr>';
        return;
      }

      rows.innerHTML = data.map(o => `
        <tr>
          <td><a href="public-opportunity-detail.html?s=${encodeURIComponent(o.slug)}" target="_blank">${escapeHtml(o.title)}</a></td>
          <td>${escapeHtml(o.category)}</td>
          <td>${escapeHtml(o.profiles?.full_name || '—')}</td>
          <td>${o.is_approved ? '<span class="status-badge">Live</span>' : '<span class="status-badge" style="color:#FCD34D;">Pending</span>'}</td>
          <td class="row-actions">
            ${!o.is_approved ? `<button class="btn-ghost approve-btn" data-id="${o.id}">Approve</button>` : `<button class="btn-ghost unapprove-btn" data-id="${o.id}">Unpublish</button>`}
            <button class="btn-ghost delete-btn" data-id="${o.id}" style="color:#FCA5A5;">Delete</button>
          </td>
        </tr>
      `).join('');

      rows.querySelectorAll('.approve-btn').forEach(btn => btn.addEventListener('click', async () => {
        await supabase.from('opportunities').update({ is_approved: true }).eq('id', btn.dataset.id);
        await logAdminAction({ adminId: admin.id, action: 'opportunity_approved', targetTable: 'opportunities', targetId: btn.dataset.id });
        load();
      }));
      rows.querySelectorAll('.unapprove-btn').forEach(btn => btn.addEventListener('click', async () => {
        await supabase.from('opportunities').update({ is_approved: false }).eq('id', btn.dataset.id);
        await logAdminAction({ adminId: admin.id, action: 'opportunity_unpublished', targetTable: 'opportunities', targetId: btn.dataset.id });
        load();
      }));
      rows.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Delete this opportunity?')) return;
        await supabase.from('opportunities').delete().eq('id', btn.dataset.id);
        await logAdminAction({ adminId: admin.id, action: 'opportunity_deleted', targetTable: 'opportunities', targetId: btn.dataset.id });
        load();
      }));
    }

    load();
  </script>
</body>
</html>
