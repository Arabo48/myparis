<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquiries</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <button type="button" class="back-button" onclick="if (document.referrer && document.referrer.indexOf(location.host) !== -1 && document.referrer !== location.href) { history.back(); } else { location.href = 'member-dashboard.html'; }">&larr; Back</button>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="brand">MY TOWN TECH</div>
      <nav>
        <a href="member-dashboard.html">Overview</a>
        <a href="member-inquiries.html" class="active">Inquiries</a>
        <a href="member-settings.html">Settings</a>
        <a href="admin-dashboard.html" id="switchToAdminLink" hidden style="border-top:1px solid var(--color-border);margin-top:8px;padding-top:14px;">Switch to Admin View</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <h1>Inquiries</h1>
      <p class="placeholder-text">Messages from people who found your profile and want to connect.</p>
      <div id="list" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <p class="placeholder-text">Loading…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireRole } from './auth.js';
    import { supabase } from './supabase-client.js';
    import { escapeHtml } from './utils.js';

    const profile = await requireRole(['member', 'mentor', 'organization', 'admin', 'super_admin']);
    if (profile && ["admin", "super_admin"].includes(profile.role)) {
      const switchLink = document.getElementById("switchToAdminLink");
      if (switchLink) switchLink.hidden = false;
    }
    if (!profile) throw new Error('Not authorized');

    async function load() {
      const { data, error } = await supabase
        .from('contact_requests')
        .select('*')
        .eq('target_profile_id', profile.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('list');
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="placeholder-text">No inquiries yet.</p>';
        return;
      }

      list.innerHTML = data.map(r => `
        <div class="list-row">
          <strong>${escapeHtml(r.sender_name)}</strong> &lt;${escapeHtml(r.sender_email)}&gt;
          <p style="margin:8px 0 0;">${escapeHtml(r.message)}</p>
          <p class="placeholder-text" style="margin:8px 0 0;font-size:0.78rem;">${new Date(r.created_at).toLocaleString()}</p>
        </div>
      `).join('');
    }

    load();
  </script>
  <style>
    .list-row { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 16px; }
  </style>
</body>
</html>
