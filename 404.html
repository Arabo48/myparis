<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="forms.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card" style="text-align:center;">
      <h1 style="font-size:2.4rem;margin-bottom:6px;">404</h1>
      <p class="auth-subtitle">The page you're looking for doesn't exist or may have been moved.</p>
      <a href="index.html" class="btn-primary" style="margin-top:14px;display:inline-block;">Back to Home</a>
      <a href="public-members.html" class="btn-ghost" style="margin-top:10px;display:inline-block;">Browse Members</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js';
    // Keep branding consistent even on the error page.
    supabase.from('platform_settings').select('platform_name').limit(1).maybeSingle()
      .then(({ data }) => { if (data?.platform_name) document.title = `Page Not Found — ${data.platform_name}`; })
      .catch(() => {});
  </script>
</body>
</html>
